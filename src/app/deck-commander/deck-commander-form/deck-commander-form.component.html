<h3>DeckCommanders Form</h3>

<div class="source-form-card">
  <p-card [header]="entityId() ? 'Edit DeckCommander' : 'New DeckCommander'">
    <div class="form-field">
      <label for="name" class="block">Name</label>
      <input pInputText id="name" type="text" [formField]="form.name" placeholder="Enter source name" />
    </div>

    <div class="form-field">
      <label for="description" class="block">Description</label>
      <textarea id="description" pTextarea [formField]="form.description" rows="5" class="w-full" placeholder="Enter source content"></textarea>
    </div>

    <div class="form-field">
      <label for="img" class="block">Image URL</label>
      <input pInputText id="img" type="text" [formField]="form.img" placeholder="Enter image URL" />
    </div>

    <div class="form-field">
      <label for="type" class="block">Type</label>
      <p-select
        id="type"
        [options]="commandTypes"
        [ngModel]="entityForm().type"
        (ngModelChange)="entityForm.update(m => ({ ...m, type: $event }))"
        (onBlur)="form.type().markAsTouched()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select a type"
      />
    </div>

    <div class="form-field">
      <label for="command" class="block">Command</label>
      <input pInputText id="command" type="text" [formField]="form.command" placeholder="Enter command" />
    </div>

    <div class="form-field">
      <label for="action" class="block">Action</label>
      <input pInputText id="action" type="text" [formField]="form.action" placeholder="Enter action" />
    </div>

    <div class="form-field">
      <label for="emoji" class="block">Emoji</label>
      <input pInputText id="emoji" type="text" [formField]="form.emoji" placeholder="Enter emoji" />
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 1rem">
      <p-button (click)="save()" label="Save DeckCommander" [disabled]="!isValid() || isSaving()" [loading]="isSaving()" icon="pi pi-check" iconPos="right"></p-button>
    </div>
  </p-card>
</div>
