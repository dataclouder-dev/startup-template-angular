<h3>Live2ds Form</h3>

<div class="source-form-card">
  <p-card [header]="entityId() ? 'Edit Live2d' : 'New Live2d'">
    <form [formGroup]="form">
      <div style="display: flex; gap: 10px">
        <div class="form-field">
          <label class="block" pTooltip="Image should be handle after upload">Subir imagen</label>
          <img width="218px" [src]="form.get('image')?.value?.url || 'defaults/images/face-3.jpg'" alt="Live2D image" />
          <dc-cropper-modal [imgStorageSettings]="storageImgSettings" (imageUploaded)="handleImageUpload($event)"></dc-cropper-modal>
        </div>

        <div style="width: 100%">
          <div class="form-field">
            <label for="name" class="block">Name</label>
            <input pInputText id="name" type="text" formControlName="name" placeholder="Enter source name" />
          </div>

          <div class="form-field">
            <label for="description" class="block">Description</label>
            <textarea id="description" pTextarea formControlName="description" rows="3" class="w-full" placeholder="Enter source content"> </textarea>
          </div>
        </div>
      </div>




    </form>

    <div style="display: flex; justify-content: flex-end">
      <p-button (click)="save()" label="Save Live2d" [disabled]="!form.valid" icon="pi pi-check" iconPos="right"> </p-button>
    </div>

    <div>
      @for(relation of relationPopupSelector; track relation.id) {
      <p-chip [label]="relation.name" [image]="relation.image" alt="Avatar image" [removable]="true" (onRemove)="removeRelationFromList(relation)" />
      }
    </div>

    <p-dialog header="Search for relation" [(visible)]="isDialogVisible" [modal]="true" [style]="{ width: '50vw' }" draggable="false">
      <app-live2d-list [onlyView]="true" (onSelect)="handleRelationSelection($event)"></app-live2d-list>
    </p-dialog>
  </p-card>
</div>

<div class="p-4">
  <h4>Files Attached</h4>
  <div class="flex flex-column gap-2 mb-4">
    @for(file of form.get('files')?.value; track file.url) {
    <div class="flex align-items-center justify-content-between p-2 border-round surface-100 shadow-1">
      <div class="flex align-items-center gap-2">
        <i class="pi pi-file text-primary" style="font-size: 1.5rem"></i>
        <span class="font-medium">{{ file.name || file.path }}</span>
      </div>
      <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (click)="removeFile(file)" pTooltip="Remove file" />
    </div>
    } @empty {
    <div class="text-secondary italic">No files attached yet.</div>
    }
  </div>

  <dc-backend-upload [storagePath]="'live2ds/' + entityId()" (onUploadFinish)="handleUploadFinish($event)"></dc-backend-upload>
</div>
