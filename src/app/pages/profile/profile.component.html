<div class="form-container">
  <p-card>
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-col gap-1">
        <span class="text-xs font-medium uppercase tracking-wide text-muted">Mi suscripción</span>
        <div class="flex flex-wrap items-center gap-2">
          <strong class="text-lg">{{ userService.isPremium() ? 'Plan Premium' : 'Plan Básico' }}</strong>
          <p-tag
            [value]="userService.isPremium() ? 'Activo' : 'Gratuito'"
            [severity]="userService.isPremium() ? 'success' : 'secondary'" />
        </div>
        @if (planExpirationDate(); as exp) {
          <span class="text-sm text-muted">Vigente hasta el {{ exp | date: 'dd/MM/yyyy' }}</span>
        }
      </div>

      <div class="flex flex-wrap gap-2">
        <p-button
          [label]="userService.isPremium() ? 'Gestionar suscripción' : 'Ver planes'"
          icon="pi pi-credit-card"
          routerLink="/page/billing" />
        @if (userService.isAdmin()) {
          <p-button
            label="Administrar precios"
            icon="pi pi-sliders-h"
            severity="secondary"
            [outlined]="true"
            routerLink="/page/admin/pricing" />
        }
      </div>
    </div>
  </p-card>

  @if (userService.user(); as user) {
    <app-profile-form [user]="user" (saveData)="saveData($event)"></app-profile-form>
  }

  <p-card>
    <dc-profile-settings-form
      [value]="settingsModel()"
      (valueChange)="settingsModel.set($event)"
      [baseLanguagesOptions]="baseLanguagesOptions"
      [targetLanguagesOptions]="[]"
      [audioSpeedOptions]="audioSpeedOptions"
      [hiddenFields]="hiddenFields"></dc-profile-settings-form>
  </p-card>

  <p-card>
    <dc-chat-settings-dialog></dc-chat-settings-dialog>
  </p-card>
</div>
