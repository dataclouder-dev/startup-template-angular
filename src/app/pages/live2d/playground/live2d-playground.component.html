<div class="playground-layout">
  <!-- Left Sidebar for Controls -->
  <aside class="sidebar">
    <header class="sidebar-header">
      <h1>Live2D Explorer</h1>
      <p class="subtitle">Model Inspector & Testing</p>
    </header>

    <div class="control-group">
      <label class="group-label">Model Selection</label>
      <p-select [options]="availableModels" [(ngModel)]="selectedModel" optionLabel="name" (onChange)="onModelChange()" placeholder="Select a model" [style]="{'width':'100%'}">
      </p-select>
    </div>

    <div class="control-group">
      <div class="label-with-value">
        <label class="group-label">Zoom</label>
        <span class="value-badge">{{ modelZoom }}%</span>
      </div>
      <p-slider [(ngModel)]="modelZoom" (onChange)="onZoomChange($event)" [min]="1" [max]="100"></p-slider>
    </div>

    <div class="control-group">
      <div class="label-with-value">
        <label class="group-label">Position X</label>
        <span class="value-badge">{{ modelX }}%</span>
      </div>
      <p-slider [(ngModel)]="modelX" (onChange)="onPositionXChange($event)" [min]="0" [max]="100"></p-slider>
    </div>

    <div class="control-group">
      <div class="label-with-value">
        <label class="group-label">Position Y</label>
        <span class="value-badge">{{ modelY }}%</span>
      </div>
      <p-slider [(ngModel)]="modelY" (onChange)="onPositionYChange($event)" [min]="0" [max]="100"></p-slider>
    </div>

    <div class="control-group">
      <label class="group-label">Camera</label>
      <div class="action-buttons">
        <button pButton type="button" label="Focus Face" icon="pi pi-user" (click)="zoomToFace()" class="p-button-info p-button-sm"></button>
        <button pButton type="button" label="Reset View" icon="pi pi-refresh" (click)="resetView()" class="p-button-secondary p-button-sm"></button>
      </div>
    </div>

    <div class="control-group">
      <label class="group-label">Model Actions</label>
      <div class="action-buttons">
        <button pButton type="button" label="Random Motion" icon="pi pi-play" (click)="playRandomAnimation()" class="p-button-outlined p-button-sm"></button>
        <button pButton type="button" label="Speak" icon="pi pi-volume-up" (click)="speak('/audios/tour/intro2.mp3')" class="p-button-success p-button-sm"></button>
        <button pButton type="button" label="Stop" icon="pi pi-power-off" (click)="stopSpeaking()" class="p-button-danger p-button-sm"></button>
      </div>
    </div>

    @if (expressions.length > 0) {
      <div class="control-group scrollable">
        <label class="group-label">Expressions</label>
        <div class="motion-grid">
          @for(exp of expressions; track $index){
            <p-button [label]="exp" (click)='setExpression(exp)' size="small" class="motion-btn"></p-button>
          }
        </div>
      </div>
    }

    @if (motionGroups.length > 0) {
      <div class="control-group scrollable">
        <label class="group-label">Available Animations</label>
        <div class="motion-grid">
          @for(group of motionGroups; track $index){
            <p-button [label]="group" (click)="playAnimation(group)" size="small" class="motion-btn"></p-button>
          }
        </div>
      </div>
    }
    
  </aside>

  <!-- Right Main Content Area for Model -->
  <main class="content-area">
    <section class="model-viewport">
      <div class="canvas-container">
        @if(selectedModel){
          <app-live2d-model [modelPath]="selectedModel.path" [scale]="selectedModel.scale" (modelLoaded)="onModelLoaded($event)" (viewStateChanged)="onViewStateChanged($event)" #live2dModel></app-live2d-model>
        }
      </div>
    </section>

    <section class="parameters-area">
      <app-model-info [modelParameters]="modelParameters" [modelParts]="modelParts" (parameterChanged)="updateModelParameter($event)"> </app-model-info>
    </section>
  </main>
</div>
