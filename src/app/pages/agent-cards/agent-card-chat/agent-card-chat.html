@if(agentCard){
<div class="media-layout">
  <!-- Background Image layer (Desktop: always, Mobile: only if no video) -->
  <div class="image-background-layer">
    <div class="blur-overlay"></div>
    <div class="image-wrapper">
      <img
        class="centered-image mobile-image"
        [src]="(agentCard.assets?.image?.url) || 'assets/defaults/images/default_conversation_card.webp'"
        alt="Background image" />
      <img
        class="centered-image desktop-banner"
        [src]="(agentCard.assets?.banner?.url) || 'assets/defaults/images/default_conversation_card.webp'"
        alt="Background banner" />
    </div>
  </div>

  <!-- Video layer (Desktop: centered, Mobile: background) -->
  @if(isVideoAvailable){
  <div class="video-container">
    <video #videoPlayer></video>
  </div>
  }
</div>

<!-- Chat Content -->
<div class="content">
  <div class="chat-container">
    <dc-chat
      (goalCompleted)="onGoalCompleted($event)"
      (chatEvent)="onChatEvent($event)"
      style="height: 100%"
      [agentCard]="agentCard"
      [conversationFlow]="DefaultConversationFlow" />
  </div>
</div>
}
