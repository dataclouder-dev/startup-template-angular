@if(agentCard){
<div class="media-layout">
  <!-- Background Image layer (Desktop: always, Mobile: only if no video) -->
  <div class="image-background-layer">
    <div class="blur-overlay"></div>
    <div class="image-wrapper">
      <img
        class="centered-image mobile-image"
        [src]="(agentCard.assets?.image?.url) || 'defaults/images/default_conversation_card.webp'"
        alt="Background image" />
      <img
        class="centered-image desktop-banner"
        [src]="(agentCard.assets?.banner?.url) || 'defaults/images/default_conversation_card.webp'"
        alt="Background banner" />
    </div>
  </div>

  <div class="content">
    <div class="chat-container">
      <dc-chat style="height: 100%" [agentCard]="agentCard" (chatEvent)="onChatEvent($event)" />
    </div>
    <div class="sticker-container">
      <app-live2d-model [modelPath]="'/assets/Resources/简/简.model3.json'" [scale]="0.08"></app-live2d-model>
    </div>
  </div>
</div>
}
